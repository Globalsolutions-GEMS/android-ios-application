name: erp_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  http: ^1.2.2
  shared_preferences: ^2.3.2
  lottie: ^3.1.2
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/Image/
    - assets/Image/GSlogo.png
    - assets/Animation/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/Font/Nunito-Regular.ttf
        - asset: assets/Font/Nunito-Italic.ttf
          style: italic
        - asset: assets/Font/Nunito-ExtraLight.ttf
          weight: 200
        - asset: assets/Font/Nunito-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/Font/Nunito-Light.ttf
          weight: 300
        - asset: assets/Font/Nunito-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/Font/Nunito-Medium.ttf
          weight: 500
        - asset: assets/Font/Nunito-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/Font/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/Font/Nunito-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/Font/Nunito-Bold.ttf
          weight: 700
        - asset: assets/Font/Nunito-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/Font/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/Font/Nunito-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/Font/Nunito-Black.ttf
          weight: 900
        - asset: assets/Font/Nunito-BlackItalic.ttf
          weight: 900
          style: italic
